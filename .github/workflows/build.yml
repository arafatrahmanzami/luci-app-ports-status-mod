name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64_cortex-a53
            version: '24.10.5'
          - arch: mips_24kc
            version: '25.12.5'
    steps:
      - uses: actions/checkout@v4

      - name: Build packages
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.version }}
          FEEDNAME: ports
          PACKAGES: luci-app-ports-status-mod

      - name: Collect artifacts
        run: |
          mkdir -p ./artifacts
          find . -name '*.ipk' -exec cp {} ./artifacts/ \; 2>/dev/null || true
          find . -name '*.apk' -exec cp {} ./artifacts/ \; 2>/dev/null || true
          ls -la ./artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.arch }}-${{ matrix.version }}
          path: ./artifacts/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - run: find ./artifacts -type f

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ./artifacts/**/*
