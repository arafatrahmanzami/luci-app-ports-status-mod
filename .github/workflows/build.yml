name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64_cortex-a53
            version: '24.10.5'
          - arch: mips_24kc
            version: '25.12.5'
    steps:
      - uses: actions/checkout@v4

      - name: Build packages
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.version }}
          FEEDNAME: ports
          PACKAGES: luci-app-ports-status-mod

      - name: Build universal rootfs tarball
        if: matrix.arch == 'aarch64_cortex-a53'
        run: |
          cd /tmp
          rm -rf rootfs-build
          mkdir -p rootfs-build
          cd rootfs-build
          IPK=$(find $GITHUB_WORKSPACE -name 'luci-app-ports-status-mod_*_all.ipk' | head -1)
          tar -xzf "$IPK"
          mkdir -p data && cd data
          tar -xzf ../data.tar.gz
          cd ..
          VER=$(grep PKG_VERSION $GITHUB_WORKSPACE/luci-app-ports-status-mod/Makefile | cut -d: -f3)
          REL=$(grep PKG_RELEASE $GITHUB_WORKSPACE/luci-app-ports-status-mod/Makefile | cut -d: -f3)
          tar --owner=0 --group=0 --numeric-owner -czf \
            $GITHUB_WORKSPACE/artifacts/luci-app-ports-status-mod-${VER}-r${REL}_rootfs.tar.gz \
            -C data .
          ls -la $GITHUB_WORKSPACE/artifacts/

      - name: Collect artifacts
        run: |
          mkdir -p ./artifacts
          find . -name 'luci-app-ports-status-mod*.ipk' -exec cp {} ./artifacts/ \; 2>/dev/null || true
          find . -name 'luci-app-ports-status-mod*.apk' -exec cp {} ./artifacts/ \; 2>/dev/null || true
          ls -la ./artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.arch }}-${{ matrix.version }}
          path: ./artifacts/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - run: find ./artifacts -type f

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ./artifacts/**/*
          body: |
            ## Installation

            ### OpenWrt 24.10.x / ImmortalWrt (IPK)
            opkg install luci-app-ports-status-mod_*.ipk

            ### OpenWrt 25.12.x (APK)
            apk add --allow-untrusted luci-app-ports-status-mod-*.apk

            ### Universal RootFS Tarball (all architectures)
            cd / && tar xzf luci-app-ports-status-mod-*_rootfs.tar.gz
            /etc/init.d/rpcd restart
            /etc/init.d/uhttpd restart

            See README for full documentation.
