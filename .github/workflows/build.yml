name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: '24.10.5'
            arch: aarch64_cortex-a53
            target: mediatek/filogic
          - release: '25.12.5'
            arch: mips_24kc
            target: ath79/generic
    steps:
      - uses: actions/checkout@v4
      - name: Build with OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ matrix.release }}
          PACKAGES: luci-app-ports-status-mod
      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          find bin/packages -name 'luci-app-ports-status-mod*' -exec cp {} artifacts/ \; || true
          ls -la artifacts/
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.arch }}
          path: artifacts/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
